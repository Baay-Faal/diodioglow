<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 50" width="170" height="50">
  <!-- Carré emblématique officiel Orange -->
  <rect x="5" y="5" width="40" height="40" rx="8" fill="#FF7900"/>
  
  <!-- Forme interne blanche stylisée / symbole Orange -->
  <rect x="13" y="13" width="24" height="24" rx="4" fill="#FF7900"/>
  <text x="25" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">om</text>

  <!-- Texte officiel « orange » en noir ou blanc -->
  <text x="56" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FF7900" letter-spacing="-0.5px">orange</text>

  <!-- Texte officiel « money » -->
  <text x="56" y="39" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1D20" letter-spacing="-0.3px">money</text>
</svg>
